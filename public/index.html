<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Timesheet</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="button-group" id="viewButtons">
      <button data-view="year">Year</button>
      <button data-view="month">Month</button>
      <button data-view="week">Week</button>
      <button data-view="day">Day</button>
    </div>
    <div class="button-group">
      <button id="prevButton" title="Previous (←)">‹</button>
      <button id="todayButton">Today</button>
      <button id="nextButton" title="Next (→)">›</button>
    </div>
    <h1 id="title"></h1>
    <label class="toggle" id="fullDayToggle"><input type="checkbox" id="fullDayCheckbox"> 24 h</label>
    <label class="toggle" id="showNotesToggle"><input type="checkbox" id="showNotesCheckbox"> Notes</label>
    <label class="toggle" id="showActivityToggle" title="Histogram of the files worked in (blocks from Revit journals)"><input type="checkbox" id="showActivityCheckbox"> File activity</label>
    <label class="toggle" id="countNoFileToggle" title="Count quarter-hours in Revit with no file loaded towards the totals"><input type="checkbox" id="countNoFileCheckbox"> Count no-file</label>
    <span class="save-status" id="saveStatus"></span>
    <div class="button-group">
      <button id="journalButton" title="Log time from Revit journal files">Revit journals</button>
      <button id="pdfButton" title="Report of chosen labels as a PDF">Export PDF</button>
      <button id="exportButton" title="Download all data as a JSON file">Export JSON</button>
      <button id="importButton" title="Replace all data with a JSON file or link">Import JSON</button>
      <button id="clearButton" title="Delete all logged time and labels">Clear all</button>
    </div>
  </header>
  <main id="view"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
