<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Timesheet</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="button-group" id="viewButtons">
      <button data-view="year">Year</button>
      <button data-view="month">Month</button>
      <button data-view="week">Week</button>
      <button data-view="day">Day</button>
    </div>
    <div class="button-group">
      <button id="prevButton" title="Previous (←)">‹</button>
      <button id="todayButton">Today</button>
      <button id="nextButton" title="Next (→)">›</button>
    </div>
    <h1 id="title"></h1>
    <label class="toggle" id="fullDayToggle"><input type="checkbox" id="fullDayCheckbox"> Show 24 h</label>
    <span class="save-status" id="saveStatus"></span>
    <div class="button-group">
      <button id="exportButton" title="Download all data as a JSON file">Export</button>
      <button id="importButton" title="Replace all data with a JSON file">Import</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </header>
  <main id="view"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
